<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../styles/styles.css" />
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
        <div class="container">
          <a class="navbar-brand fw-bold" href="../index.html"> Samigram </a>

          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="index.html"
                  >Feed
                </a>
              </li>

              <li class="nav-item">
                <a class="nav-link" href="../profile/index.html">Profile </a>
              </li>

              <li class="nav-item">
                <a class="nav-link" href="#">About</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="container">
      <h1>Feed</h1>
      <div class="mb-4">
        <label for="search" class="form-label">Search posts</label>
        <input
          type="search"
          class="form-control"
          id="search"
          placeholder="search for posts"
        />
      </div>

      <div class="mb-4">
        <label for="sort-posts" class="form-label">Sort posts</label>
        <select class="form-select" id="sort-posts">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="popular">Most popular</option>
        </select>
      </div>

      <div class="card custom-card create-custom-card">
        <h2 class="h5 mb-3">Create a post</h2>

        <form>
          <div class="mb-3">
            <label for="post-content" class="form-label">Post here</label>
            <textarea
              class="form-control"
              id="post-content"
              rows="3"
              placeholder="write something"
              required
            ></textarea>
          </div>

          <div class="mb-3">
            <label for="post-image" class="form-label">Add and Image</label>
            <input
              type="file"
              class="form-control"
              id="poost-image"
              accept="image/*"
            />
          </div>

          <button type="submit" class="btn btn-primary">Publish post</button>
        </form>
      </div>

      <h2 class="h4 mt-5 mb-3">Recent posts</h2>
      <div class="card custom-card post-card">
        <div class="card-body">
          <div class="d-flex align-items-center mb-3">
            <img
              src="../images/pfp1.png"
              alt="tower"
              class="rounded-circle me-2"
              width="45"
              height="45"
            />

            <div>
              <h3 class="h6 mb-0">Bob Cheese</h3>
              <small class="text-muted">1 hour ago</small>
            </div>
          </div>

          <p>Captured this bobcat on my camera</p>

          <img
            src="../images/post2.png"
            alt="Bobcat"
            class="img-fluid rounded mb-3 post-image"
          />

          <div class="d-flex gap-2">
            <button type="button" class="btn btn-outline-primary">like</button>
            <button type="button" class="btn btn-outline-secondary">
              comment
            </button>
          </div>
        </div>
      </div>

      <div class="card custom-card post-card">
        <div class="card-body">
          <div class="d-flex align-items-center mb-3">
            <img
              src="../images/pfp2.png"
              alt="name of the image"
              class="rounded-circle me-2"
              width="45"
              height="45"
            />

            <div>
              <h3 class="h6 mb-0">Lexi Sim</h3>
              <small class="text-muted">32 minutes ago</small>
            </div>
          </div>

          <p>Autumn trees</p>

          <img
            src="../images/post1.jpg"
            alt="autumn trees"
            class="img-fluid rounded mb-3 post-image"
          />

          <div class="d-flex gap-2">
            <button type="button" class="btn btn-outline-primary">like</button>
            <button type="button" class="btn btn-outline-secondary">
              comment
            </button>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
