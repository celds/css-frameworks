<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../styles/styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Feed</h1>
      <div class="mb-4">
        <label for="search" class="form-label">Search posts</label>
        <input
          type="search"
          class="form-control"
          id="search"
          placeholder="search for posts"
        />
      </div>

      <div class="card custom-card">
        <h2 class="h5 mb-3">Create a post</h2>

        <form>
          <div class="mb-3">
            <label for="post-content" class="form-label">Post here</label>
            <textarea
              class="form-control"
              id="post-content"
              rows="3"
              placeholder="write something"
              required
            ></textarea>
          </div>

          <div class="mb-3">
            <label for="post-image" class="form-label">Add and Image</label>
            <input
              type="file"
              class="form-control"
              id="poost-image"
              accept="image/*"
            />
          </div>

          <button type="submit" class="btn btn-primary">Publish post</button>
        </form>
      </div>
    </main>
  </body>
</html>
